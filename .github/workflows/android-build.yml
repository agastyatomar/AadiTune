name: Android build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/screenshots/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing (optional)
        id: signing
        run: |
          if [ -n "${{ secrets.AADITUNE_KEYSTORE }}" ]; then
            echo "${{ secrets.AADITUNE_KEYSTORE }}" | base64 -d > ci-release.jks
            {
              echo "keystore=$(pwd)/ci-release.jks"
              echo "storepass=${{ secrets.AADITUNE_KEYSTORE_PASSWORD }}"
              echo "alias=${{ secrets.AADITUNE_KEY_ALIAS }}"
              echo "keypass=${{ secrets.AADITUNE_KEY_PASSWORD }}"
            } >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AADITUNE_KEYSTORE secret provided - building unsigned release APK."
          fi

      - name: Unit tests (innertube + kugou, non-blocking)
        if: github.event_name != 'pull_request'
        run: sh gradlew :kugou:test :innertube:test --no-configuration-cache
        continue-on-error: true

      - name: Lint
        run: sh gradlew :app:lintFoss --no-configuration-cache
        continue-on-error: true

      - name: Build release APK
        env:
          AADITUNE_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          AADITUNE_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.storepass }}
          AADITUNE_KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          AADITUNE_KEY_PASSWORD: ${{ steps.signing.outputs.keypass }}
        run: sh gradlew assembleFossRelease --no-configuration-cache

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -1)
          [ -n "$SRC" ] || { echo "No APK produced"; ls -R app/build/outputs; exit 1; }
          echo "Found APK: $SRC"
          BASE=$(basename "$SRC")
          if echo "$BASE" | grep -q "unsigned"; then
            VNAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            DST="NovaTune-${VNAME}-foss-release-unsigned.apk"
          else
            VNAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          DST="NovaTune-${VNAME}-foss-release.apk"
          fi
          cp "$SRC" "$DST"
          echo "apk=$DST" >> "$GITHUB_OUTPUT"

      - name: Build debug APK (auto-signs with runner's debug key)
        run: sh gradlew assembleFossDebug --no-configuration-cache

      - name: Rename debug APK
        id: apkdebug
        run: |
          SRC=$(find app/build/outputs/apk/foss/debug -name "*.apk" | head -1)
          [ -n "$SRC" ] || { echo "No debug APK produced"; ls -R app/build/outputs; exit 1; }
          VNAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          DST="NovaTune-${VNAME}-foss-debug.apk"
          cp "$SRC" "$DST"
          echo "apk=$DST" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaTune-APK
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apkdebug.outputs.apk }}
          if-no-files-found: error

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apkdebug.outputs.apk }}
          body: |
            **NovaTune (latest CI build)** — free & open-source music streaming for Android.

            - `NovaTune-${AMPVER}-foss-release-unsigned.apk` is the clean release build.
              It is **unsigned** (no signing secrets are stored in this repository), so
              it cannot be sideloaded directly. This is the build to use after adding
              release signing secrets (`AADITUNE_KEYSTORE*`) to the repository.
            - `NovaTune-*-foss-debug.apk` is an installable FOSS debug build,
              auto-signed by CI with a throwaway debug key (`com.agastyatomar.aaditune.debug`).
              Fine for testing; expect to uninstall before a signed release install.
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
